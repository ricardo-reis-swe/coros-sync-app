<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333c"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b93ef"/>
      <stop offset="1" stop-color="#2258c0"/>
    </linearGradient>
  </defs>

  <!-- 824 inside 1024 is the macOS icon grid; the same square is fine cropped square on Windows and Linux. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>

  <circle cx="512" cy="512" r="300" fill="none" stroke="#26262e" stroke-width="56"/>
  <!-- 1414 of 1885 is 270 degrees: an open activity ring, which is also what a sync in progress looks like. -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round"
          stroke-dasharray="1414 471" transform="rotate(-90 512 512)"/>
  <circle cx="212" cy="512" r="27" fill="#a9ccfb"/>

  <circle cx="512" cy="512" r="248" fill="#0e0e12"/>

  <!-- The 32 degree tilt is load-bearing: upright buds read as a face, and the driver dot as a pupil. -->
  <g transform="translate(512 486)" fill="#ffffff">
    <g transform="translate(-94 0) rotate(-32) scale(1.95)">
      <circle cx="0" cy="-6" r="40"/>
      <rect x="-15" y="18" width="30" height="56" rx="15"/>
      <circle cx="0" cy="-16" r="12" fill="#0e0e12"/>
    </g>
    <g transform="translate(94 0) rotate(32) scale(1.95)">
      <circle cx="0" cy="-6" r="40"/>
      <rect x="-15" y="18" width="30" height="56" rx="15"/>
      <circle cx="0" cy="-16" r="12" fill="#0e0e12"/>
    </g>
  </g>
</svg>
