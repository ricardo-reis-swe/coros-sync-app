name: release

# Forge names every installer from package.json, so "which build shipped" has to be a version
# someone chose, never a run number — a tag says it, and on a dispatch package.json says it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with package.json ships v1.0.0 files under a v1.1.0 release.
      - name: Name the release
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p "require('./package.json').version")

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${pkg}"
              exit 1
            fi
            tag=$GITHUB_REF_NAME
          else
            # No tag to read, so package.json is the version someone chose; gh cuts the tag at publish.
            tag=v$pkg
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$tag is already released — bump package.json before dispatching"
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: guard
    uses: ./.github/workflows/build-linux.yml

  macos:
    needs: guard
    uses: ./.github/workflows/build-macos.yml

  windows:
    needs: guard
    uses: ./.github/workflows/build-windows.yml

  publish:
    needs: [guard, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      # The one job here that writes: the release and its assets.
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coros-sync-app-*
          path: dist
          merge-multiple: true

      - name: Collect installers
        run: |
          mkdir -p upload
          # Squirrel's RELEASES/.nupkg pair exists to feed an updater this app does not have (ADR-0014).
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.exe' \) |
            while read -r f; do
              # Squirrel's installer name carries a space; a download URL should not.
              cp "$f" "upload/$(basename "$f" | tr ' ' '.')"
            done
          ls -l upload

      # Draft, not live: the LGPL notices these binaries owe are not in the release yet
      # (resources/README.md § Shipping). Publishing is a human step until they are.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # --target is what creates the tag on a dispatch; gh ignores it when the tag exists.
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          gh release create "$TAG" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft
